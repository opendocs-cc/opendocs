server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/plain text/markdown;

  # Markdown copies of every page (generated by scripts/generate-llms.mjs).
  location ~* \.md$ {
    types { }
    default_type text/markdown;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Build assets have content hashes in their names, so they never change.
  # Files from earlier builds are served from /usr/share/nginx/legacy (a
  # volume on the server), so a page a browser loaded before a deploy can
  # still fetch the CSS and JS it references.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @legacy_assets;
  }

  location @legacy_assets {
    root /usr/share/nginx/legacy;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Missing pages get a real 404 status (with the HTML 404 page), so agents
  # and crawlers don't mistake them for content. HTML is revalidated on every
  # visit: without a Cache-Control header browsers reuse it for up to 10% of
  # its age, and stale HTML points at assets the new build doesn't have.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
